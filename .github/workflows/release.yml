name: Release

on:
  # Pushes to main build + test only. They also keep the Cargo cache warm: GitHub caches are
  # scoped per ref, and only caches saved on the default branch can be restored by tag builds.
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.1.0); defaults to Cargo.toml version"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release build; superseded main builds can go.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Package + upload artifacts only for tags and manual runs.
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  build-windows:
    name: Build Windows x64 (GUI + CLI + Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          # Only main saves (tag-scoped caches are unreachable by later tags anyway).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tests run with --release so they share compiled dependencies with the release build
      # below instead of compiling the whole tree a second time in debug mode.
      # Platform-independent crates (protocol, server) are tested on the faster Linux runner.
      - name: Run tests
        shell: pwsh
        run: cargo test --release -p client -p game-accel-gui

      - name: Build release binaries
        shell: pwsh
        run: cargo build --release -p game-accel-gui -p client

      - name: Package Windows portable zip and Inno Setup installer
        if: env.IS_RELEASE == 'true'
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver) -and "${{ github.ref }}".StartsWith("refs/tags/v")) {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            pwsh -File scripts/package-windows.ps1 -SkipBuild
          } else {
            pwsh -File scripts/package-windows.ps1 -SkipBuild -Version $ver
          }

      - name: Upload Windows artifacts
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/game-accel-*-windows-x64-portable.zip
            dist/game-accel-*-windows-x64-setup.exe
          if-no-files-found: error

  build-linux-server:
    name: Build Linux x86_64 (Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --release -p protocol -p server

      - name: Build and package Linux server
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ inputs.version }}"
          if [[ -z "$VER" && "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VER" ]]; then
            VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          VER="${VER#v}"

          cargo build --release -p server
          mkdir -p dist/server-stage
          cp target/release/server dist/server-stage/
          cp scripts/install.sh dist/server-stage/
          cp README.md dist/server-stage/
          chmod +x dist/server-stage/server dist/server-stage/install.sh
          tar -C dist/server-stage -czf "dist/game-accel-server-v${VER}-linux-x86_64.tar.gz" .

      - name: Upload Linux server artifact
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-server
          path: dist/game-accel-server-*-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
