[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/client",
    "crates/server",
    "crates/gui",
]
default-members = ["crates/gui"]

[workspace.package]
version = "0.3.3"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dashmap = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
futures-util = "0.3"
netstack-smoltcp = "0.2.5"
quinn = "0.11"
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
tun-rs = { version = "2.8", features = ["async"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
